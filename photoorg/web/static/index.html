<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2f6feb">
  <title>照片归档 · 出勤统计</title>
  <link rel="stylesheet" href="/static/app.css?v=20261031-ui19">
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand"><i class="dot"></i><span>照片归档 · 出勤统计</span></div>
    <div class="controls">
      <label class="field"><span>班级</span><select id="classSelect"></select></label>
      <button class="btn sm" type="button" onclick="window.PO.openCreateClass()" title="新建班级">＋ 班级</button>
      <label class="field"><span>批次</span><select id="batchSelect"></select></label>
      <span id="statePill" class="pill grey">加载中</span>
    </div>
    <span class="spacer"></span>
    <div class="header-actions">
      <button class="btn sm" id="rebuildBtn" title="完全从数据库重建 out/ 目录">重建归档</button>
      <a class="btn sm" id="outReport" target="_blank" title="下载全班出勤统计表（活动×人员，CSV）">下载报告</a>
    </div>
  </div>
  <div class="tabs-shell">
    <nav class="tabs" id="tabs">
      <button data-page="overview" class="on">总览</button>
      <button data-page="review">灰区复核 <span id="reviewBadge" class="badge zero">0</span></button>
      <button data-page="inspect">结果审查</button>
      <button data-page="gallery">底库管理</button>
      <button data-page="stats">年度统计</button>
      <button data-page="photos">活动照片</button>
      <button data-page="clusters">冷启动聚类</button>
      <button data-page="settings">设置与审计</button>
    </nav>
  </div>
</header>
<main id="main"><div class="empty"><div class="big">⏳</div>正在读取本地数据…</div></main>
<footer class="site-footer">
  <div class="foot-inner">
    <span class="foot-brand">Powered by <b>罗艺</b></span>
    <span class="foot-dot">·</span>
    <span>联系方式：微信 <button class="wechat" type="button" title="点击复制微信号" onclick="window.PO.copyWechat()">luoyi8847</button></span>
  </div>
</footer>
<div id="modalRoot"></div><div id="toasts"></div>
<script src="/static/app.js?v=20261031-ui19"></script>
</body>
</html>
