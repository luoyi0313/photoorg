name: build-windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"
          cache: "pip"

      - name: Cache face model
        uses: actions/cache@v4
        with:
          path: vendor/insightface
          key: buffalo-l-v1

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[build]"

      - name: Verify build tools
        run: |
          python -c "import sys, PyInstaller; print(sys.version); print('PyInstaller', PyInstaller.__version__)"

      - name: Build portable folder and zip
        shell: bash
        run: |
          set -o pipefail
          python -u packaging/build_windows.py 2>&1 | tee build.log

      - name: Normalize release asset names
        run: python packaging/normalize_release_assets.py

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: photoorg-windows-x64
          path: |
            dist/photoorg-Windows-x64.zip
            dist/photoorg-Windows-x64.sha256.txt
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/photoorg-Windows-x64.zip
            dist/photoorg-Windows-x64.sha256.txt
