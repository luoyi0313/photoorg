[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "photoorg"
version = "2.1.3"
description = "班级照片归档与出勤统计工具（本地人脸注册 + 匹配，人工修正为一等能力）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "onnxruntime>=1.16",
    "insightface>=0.7.3",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "httpx>=0.27"]
build = ["pyinstaller>=6.10,<7"]

[project.scripts]
photoorg = "photoorg.cli:main"
photoorg-desktop = "photoorg.desktop:main"

[tool.setuptools.packages.find]
include = ["photoorg*"]

[tool.setuptools.package-data]
photoorg = ["web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
